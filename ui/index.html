<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>Xlam Connect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <div class="brand"><img src="../assets/icon.png" alt=""><span>XLAM <b>CONNECT</b></span></div>
      <div class="win-btns">
        <button data-win="minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button data-win="maximize" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
        <button data-win="close" class="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </header>
    <div class="shell">
      <aside id="sidebar"></aside>
      <main id="main"></main>
      <aside id="chat"></aside>
    </div>
    <div id="dialog-root"></div>
    <div id="toast-root"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
